name: sm_crypto_flutter
description: "Pure Dart implementation of the Chinese national cryptography standards SM2, SM3 and SM4 (国密算法), API-aligned and interoperable with sm-crypto (JavaScript)."
version: 0.1.2
homepage: https://github.com/jeromexiong/sm_crypto_flutter
repository: https://github.com/jeromexiong/sm_crypto_flutter
issue_tracker: https://github.com/jeromexiong/sm_crypto_flutter/issues

environment:
  sdk: '>=3.7.0 <4.0.0'

dev_dependencies:
  test: ^1.25.0

topics:
  - cryptography
  - encryption
  - sm2
  - sm3
  - sm4
