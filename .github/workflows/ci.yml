name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # 包在子目录里，所有 dart 命令都在包目录内执行
        working-directory: sm_crypto_flutter
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze
      # pub.dev 的「Pass static analysis」会计入 dart format 结果（不符即扣 10 分），
      # 但 pana 只检查 lib/。这里同样只查 lib/：不同 SDK 版本的格式化器对 test/tool
      # 文件可能给出不同结果（实测 CI 的 Dart 3.13 与本地 3.12 对 test/sm4_test.dart
      # 输出不同），全量检查会造成与发布无关的假红。
      - name: Verify formatting (lib)
        run: dart format --output=none --set-exit-if-changed lib
      - name: Run tests
        run: dart test
      # 发布前哨：把 pubspec 字段、LICENSE、文件清单等发布期校验提前到每次 push
      # （首版手动发布踩过的坑——比如 description 不足 60 字符——在这里就会红）
      - name: Publish dry-run
        run: dart pub publish --dry-run
